server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # L'API est servie par le conteneur backend (même réseau Docker).
    # Résolution différée au moment de la requête : évite l'échec
    # "host not found in upstream" si le backend n'est pas encore
    # résolu lors du démarrage de nginx.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sesame_backend http://backend:4000;
        proxy_pass $sesame_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
