# docker-compose.override.yml
# Configuration Vault pour l'environnement de développement
# Utilise AppRole pour l'authentification (plus sécurisé que le token root)

services:
  backend:
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault_role_id
      VAULT_SECRET_ID_FILE: /run/secrets/vault_secret_id
    depends_on:
      vault:
        condition: service_healthy
    secrets:
      - vault_role_id
      - vault_secret_id

  vault:
    image: hashicorp/vault:1.16
    hostname: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - vault_dev_data:/vault/file
      - ./docker/vault:/docker-entrypoint-init.d:ro
    entrypoint: /docker-entrypoint-init.d/entrypoint.sh

secrets:
  vault_role_id:
    file: ./docker/vault/secrets/vault_role_id
  vault_secret_id:
    file: ./docker/vault/secrets/vault_secret_id

volumes:
  vault_dev_data:
